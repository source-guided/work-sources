name: Validate source
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: source-guided/project-builder
          path: client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 client/scripts/validate_source.py --source source
